  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ems:flex-end}\n  label.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);font-weight:700;flex:1;min-width:120px;\n    text-transform:uppercase;letter-spacing:.3px}\n  select,input,button{font-size:15px;font-family:var(--sans)}\n  select,input{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:2px;padding:10px 11px;width:100%}\n  select:focus,input:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px rgba(179,85,42,.15)}\n  button{cursor:pointer}\n  .toggle{display:flex;gap:6px;margin-top:2px}\n  .toggle button{flex:1;background:var(--panel2);color:var(--muted);border:1px solid var(--line);\n    border-radius:2px;padding:8px 6px;font-weight:700;font-size:12.5px}\n  .toggle button.on{background:var(--green);color:#fbf6ec;border-color:var(--green-dark)}\n  .courtRow{padding:13px 0;border-top:1px solid var(--line)}\n  .courtRow:first-child{border-top:none}\n  .cname{font-family:var(--serif);font-weight:600;font-size:15.5px;color:var(--ink)}\n  .cmeta{font-size:11.5px;color:var(--muted);margin-top:2px}\n  .pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:2px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}\n  .pill.good{background:var(--goodbg);color:var(--goodtx)}\n  .pill.caution{background:var(--cautionbg);color:var(--cautiontx)}\n  .pill.no{background:var(--nobg);color:var(--notx)}\n  .bar{display:flex;height:12px;border-radius:2px;overflow:hidden;margin-top:9px;background:var(--panel2);border:1px solid var(--line)}\n  .seg{flex:1 1 0}\n  .seg.good{background:var(--good)}.seg.caution{background:var(--caution)}.seg.no{background:var(--no)}\n  .win{font-size:12.5px;color:var(--txt);margin-top:8px;line-height:1.7}\n  .win .dot,.legend .dot2{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}\n  .verdictWrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}\n  .verdict{font-family:var(--serif);font-size:28px;font- \n  .miniHdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 4px}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<header>\n  <div class=\"wrap\" style=\"padding:0\">\n    <div class=\"brand\"><span class=\"ball\"><\u002Fspan><h1>Nashville Tennis Weather<\u002Fh1><\u002Fdiv>\n    <div class=\"sub\" id=\"subline\">Rain-aware playability for local courts · loading forecast…<\u002Fdiv>\n    <div class=\"tabs\">\n      <div class=\"tab active\" data-mode=\"now\" onclick=\"setMode('now')\">Now<small>can I play?<\u002Fsmall><\u002Fdiv>\n      <div class=\"tab\" data-mode=\"compare\" onclick=\"setMode('compare')\">Compare<small>all courts today<\u002Fsmall><\u002Fdiv>\n      <div class=\"tab\" data-mode=\"plan\" onclick=\"setMode('plan')\">Plan<small>best court, my time<\u002Fsmall><\u002Fdiv>\n      <div class=\"tab\" data-mode=\"detail\" onclick=\"setMode('detail')\">Detail<small>temp + radar<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"wrap\">\n  <div id=\"app\"><div class=\"loading\">Loading forecast for all courts…<\u002Fdiv><\u002Fdiv>\n\n  <div class=\"legend\">\n    <span><span class=\"dot2\" style=\"background:var(--good)\"><\u002Fspan>Good — go play<\u002Fspan>\n    <span><span class=\"dot2\" style=\"background:var(--caution)\"><\u002Fspan>Caution — watch it<\u002Fspan>\n    <span><span class=\"dot2\" style=\"background:var(--no)\"><\u002Fspan>No — rain / too cold / hot<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"muted\" style=\"margin-top:12px\">\n    Data: <a href=\"https://open-meteo.com\" target=\"_blank\" rel=\"noopener\">Open-Meteo<\u002Fa> ·\n    radar by <a href=\"https://www.windy.com\" target=\"_blank\" rel=\"noopener\">Windy<\u002Fa> ·\n    <a href=\"#\" onclick=\"loadWeather();return false;\">refresh<\u002Fa> · <span id=\"updated\"><\u002Fspan>\n  <\u002Fdiv>\n  <details>\n    <summary>Playability rules used<\u002Fsummary>\n    <div class=\"muted\" style=\"margin-top:6px\" id=\"rulesText\"><\u002Fdiv>\n  <\u002Fdetails>\n<\u002Fdiv>\n\n<script>\n/* ============================================================\n   EDIT ME: COURTS\n   Add a court by copying a line. Get lat/lon from Google Maps\n   (right-click a spot → the first two numbers are lat, lon).\n   ============================================================ */\nconst COURTS = [\n  { name:\"Cedar Hill Park\",              area:\"Nashville\",   lat:36.2692019, lon:-86.7463320 },\n  { name:\"Centennial Sportsplex TC\",     area:\"Nashville\",   lat:36.1510414, lon:-86.8111540 },\n  { name:\"Charlotte Park\",               area:\"Nashville\",   lat:36.1541519, lon:-86.8728545 },\n  { name:\"Vanderbilt (Currey) TC\",       area:\"Nashville\",   lat:36.1415440, lon:-86.8073930 },\n  { name:\"Elmington Park\",               area:\"Nashville\",   lat:36.1313896, lon:-86.8221777 },\n  { name:\"Fannie Mae Dees Park\",         area:\"Nashville\",   lat:36.1376458, lon:-86.8080123 },\n  { name:\"Hadley Park Tennis Club\",      area:\"Nashville\",   lat:36.1671468, lon:-86.8218929 },\n  { name:\"McFerrin Park\",                area:\"Nashville\",   lat:36.1821137, lon:-86.7671741 },\n  { name:\"Montgomery Bell Academy\",      area:\"Nashville\",   lat:36.1610770, lon:-86.8403350 },\n  { name:\"Richland Park\",                area:\"Nashville\",   lat:36.1520685, lon:-86.8451220 },\n  { name:\"Ted Rhodes Park\",              area:\"Nashville\",   lat:36.1925102, lon:-86.8157588 },\n  { name:\"Crockett Park\",                area:\"Brentwood\",   lat:35.9776687, lon:-86.7763592 },\n  { name:\"Granny White Park\",            area:\"Brentwood\",   lat:36.0190151, lon:-86.8207813 },\n  { name:\"Maryland Farms YMCA\",          area:\"Brentwood\",   lat:36.0320862, lon:-86.7974611 },\n  { name:\"Adams Tennis Complex\",         area:\"Murfreesboro\",lat:35.8512633, lon:-86.4107732 },\n  { name:\"Farm & Forge Club\",            area:\"College Grove (approx — edit if needed)\", lat:35.8380000, lon:-86.6990000 },\n  { name:\"Skyline Tennis Club\",          area:\"Green Hills\", lat:36.108186, lon:-86.831831},\n];\n\n/* ============================================================\n   EDIT ME: PLAYABILITY THRESHOLDS (feels-like °F, precip inch, %, mph)\n   ============================================================ */\nconst CONFIG = {\n  hours:  { start:6, end:22 },\n  temp:   { minNo:40, minCaution:45, maxCaution:90, maxNo:95 },\n  rain:   { precipNo:0.01, probNo:70, probCaution:40 },\n  wind:   { gustCaution:30, gustNo:40, sustainedCaution:22 },\n};\nconst DURATIONS = [[30,\"30 min\"],[60,\"1 hr\"],[90,\"1.5 hr\"],[120,\"2 hr\"],[180,\"3 hr\"]];\n\n/* ---------------- state ---------------- */\nlet DATA=null, mode=\"now\", ui={date:null};\n\n/* ---------------- time helpers ---------------- */\nfunction toMinutes(t){ const[d,tm]=t.split(\"T\");const[Y,M,D]=d.split(\"-\").map(Number);\n  const[h,mi]=tm.split(\":\").map(Number); return Date.UTC(Y,M-1,D,h,mi)/60000; }\nfunction nowMinsCentral(){\n  const f=new Intl.DateTimeFormat(\"en-CA\",{timeZone:\"America/Chicago\",year:\"numeric\",month:\"2-digit\",\n    day:\"2-digit\",hour:\"2-digit\",minute:\"2-digit\",hour12:false});\n  const p={}; f.formatToParts(new Date()).forEach(x=>{if(x.type!==\"literal\")p[x.type]=x.value});\n  let h=p.hour===\"24\"?\"00\":p.hour; return toMinutes(`${p.year}-${p.month}-${p.day}T${h}:${p.minute}`);\n}\nfunction todayCentral(){\n  const f=new Intl.DateTimeFormat(\"en-CA\",{timeZone:\"America/Chicago\",year:\"numeric\",month:\"2-digit\",day:\"2-digit\"});\n  const p={}; f.formatToParts(new Date()).forEach(x=>{if(x.type!==\"literal\")p[x.type]=x.value});\n  return `${p.year}-${p.month}-${p.day}`;\n}\nfunction fmtTime(t){ let[,tm]=t.split(\"T\");let[h,m]=tm.split(\":\").map(Number);\n  const ap=h<12?\"AM\":\"PM\";let hh=h%12;if(hh===0)hh=12;return `${hh}:${String(m).padStart(2,\"0\")} ${ap}`; }\nfunction labelFromMins(m){ const b=new Date(Date.UTC(1970,0,1));b.setUTCMinutes(m);\n  let h=b.getUTCHours(),mi=b.getUTCMinutes();const ap=h<12?\"AM\":\"PM\";let hh=h%12;if(hh===0)hh=12;\n  return `${hh}:${String(mi).padStart(2,\"0\")} ${ap}`; }\nfunction fmtDate(dstr){ const[Y,M,D]=dstr.split(\"-\").map(Number);\n  return new Date(Date.UTC(Y,M-1,D)).toLocaleDateString(\"en-US\",{weekday:\"short\",month:\"short\",day:\"numeric\",timeZone:\"UTC\"}); }\nfunction hLabel(h){ const ap=h<12?\"am\":\"pm\";let hh=h%12;if(hh===0)hh=12;return hh+ap; }\n\n/* ---------------- scoring ---------------- */\nfunction rank(o){ return {good:0,caution:1,no:2}[o]; }\nfunction score(s){\n  const reasons=[]; let status=\"good\";\n  const bump=x=>{ if(rank(x)>rank(status)) status=x; };\n  const f=s.feels;\n  if(s.precip>=CONFIG.rain.precipNo){ bump(\"no\"); reasons.push(`Rain in forecast (${s.precip.toFixed(2)} in)`); }\n  else if(s.prob>=CONFIG.rain.probNo){ bump(\"no\"); reasons.push(`High rain chance (${s.prob}%)`); }\n  else if(s.prob>=CONFIG.rain.probCaution){ bump(\"caution\"); reasons.push(`Some rain chance (${s.prob}%)`); }\n  if(f<CONFIG.temp.minNo){ bump(\"no\"); reasons.push(`Too cold (feels ${Math.round(f)}°)`); }\n  else if(f<CONFIG.temp.minCaution){ bump(\"caution\"); reasons.push(`Chilly (feels ${Math.round(f)}°)`); }\n  else if(f>CONFIG.temp.maxNo){ bump(\"no\"); reasons.push(`Too hot (feels ${Math.round(f)}°)`); }\n  else if(f>CONFIG.temp.maxCaution){ bump(\"caution\"); reasons.push(`Hot (feels ${Math.round(f)}°)`); }\n  if(s.gust>=CONFIG.wind.gustNo){ bump(\"caution\"); reasons.push(`Very windy (gusts ${Math.round(s.gust)} mph)`); }\n  else if(s.gust>=CONFIG.wind.gustCaution||s.wind>=CONFIG.wind.sustainedCaution){ bump(\"caution\"); reasons.push(`Breezy (gusts ${Math.round(s.gust)} mph)`); }\n  if(status===\"good\") reasons.push(\"Clear & comfortable\");\n  return { status, reasons };\n}\nfunction comfort(s){ let v=100;const f=s.feels;\n  v-=s.prob*0.8; if(s.precip>=CONFIG.rain.precipNo) v-=60;\n  if(f<CONFIG.temp.minNo||f>CONFIG.temp.maxNo) v-=100;\n  else if(f<CONFIG.temp.minCaution||f>CONFIG.temp.maxCaution) v-=15;\n  v-=Math.max(0,s.gust-15)*0.8; v-=Math.abs(f-72)*0.35;\n  return Math.max(0,Math.min(100,Math.round(v))); }\n\n/* ---------------- data ---------------- */\nfunction buildSlots(m15,hourly){\n  const probByHour={};\n  (hourly.time||[]).forEach((t,i)=>{ probByHour[t.slice(0,13)]=hourly.precipitation_probability?.[i]??0; });\n  const slots=[]; const mt=m15?.time||[];\n  for(let i=0;i<mt.length;i++){ const t=mt[i];\n    const feels=m15.apparent_temperature?.[i]??m15.temperature_2m?.[i]??0;\n    slots.push({ t,date:t.slice(0,10),mins:toMinutes(t),gran:15,\n      temp:m15.temperature_2m?.[i]??feels,feels,precip:m15.precipitation?.[i]??0,\n      prob:probByHour[t.slice(0,13)]??0,wind:m15.wind_speed_10m?.[i]??0,gust:m15.wind_gusts_10m?.[i]??0 }); }\n  const lastM=slots.length?slots[slots.length-1].mins:-1; const ht=hourly.time||[];\n  for(let i=0;i<ht.length;i++){ const t=ht[i],mn=toMinutes(t); if(mn<=lastM) continue;\n    const feels=hourly.apparent_temperature?.[i]??hourly.temperature_2m?.[i]??0;\n    slots.push({ t,date:t.slice(0,10),mins:mn,gran:60,\n      temp:hourly.temperature_2m?.[i]??feels,feels,precip:hourly.precipitation?.[i]??0,\n      prob:hourly.precipitation_probability?.[i]??0,wind:hourly.wind_speed_10m?.[i]??0,gust:hourly.wind_gusts_10m?.[i]??0 }); }\n  return slots;\n}\nasync function loadWeather(){\n  document.getElementById(\"app\").innerHTML='<div class=\"loading\">Loading forecast for all courts…<\u002Fdiv>';\n  const lats=COURTS.map(c=>c.lat.toFixed(4)).join(\",\"), lons=COURTS.map(c=>c.lon.toFixed(4)).join(\",\");\n  const url=\"https://api.open-meteo.com/v1/forecast\"\n    +`?latitude=${lats}&longitude=${lons}`\n    +\"&minutely_15=temperature_2m,apparent_temperature,precipitation,wind_speed_10m,wind_gusts_10m\"\n    +\"&hourly=precipitation_probability,precipitation,temperature_2m,apparent_temperature,wind_speed_10m,wind_gusts_10m\"\n    +\"&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&forecast_days=7\";\n  try{\n    const res=await fetch(url); if(!res.ok) throw new Error(\"HTTP \"+res.status);\n    let json=await res.json(); if(!Array.isArray(json)) json=[json];\n    DATA=COURTS.map((c,i)=>({court:c,slots:buildSlots(json[i]?.minutely_15||{},json[i]?.hourly||{})}));\n    const dates=[...new Set(DATA[0].slots.map(s=>s.date))];\n    if(!ui.date||!dates.includes(ui.date)) ui.date=dates.includes(todayCentral())?todayCentral():dates[0];\n    document.getElementById(\"subline\").textContent=\"Rain-aware playability for \"+COURTS.length+\" Midstate Tennessee courts\";\n    const now=new Date().toLocaleTimeString(\"en-US\",{timeZone:\"America/Chicago\",hour:\"numeric\",minute:\"2-digit\"});\n    document.getElementById(\"updated\").textContent=\"updated \"+now+\" CT\";\n    render();\n  }catch(e){\n    document.getElementById(\"app\").innerHTML='<div class=\"err\">Could not load the forecast ('+e.message\n      +'). Check your connection and tap refresh.<\u002Fdiv>';\n  }\n}\n\n/* ---------------- windows (compare) ---------------- */\nfunction inHours(s){ const h=+s.t.slice(11,13); return h>=CONFIG.hours.start && h<CONFIG.hours.end; }\nfunction windowsFor(slots){\n  const list=slots.filter(inHours).sort((a,b)=>a.mins-b.mins);\n  const wins=[]; let cur=null;\n  for(const s of list){ const st=score(s).status;\n    if(st===\"no\"){ if(cur){wins.push(cur);cur=null;} continue; }\n    if(cur && s.mins-cur.end<=cur.step+1){ cur.end=s.mins; if(rank(st)>rank(cur.status))cur.status=st; }\n    else { if(cur)wins.push(cur); cur={start:s.mins,end:s.mins,step:s.gran,status:st}; } }\n  if(cur) wins.push(cur); return wins;\n}\n\n/* ---------------- duration window eval ---------------- */\nfunction evalWindow(slots,start,dur){\n  const end=start+dur;\n  const seg=slots.filter(s=>s.mins>=start && s.mins<end).sort((a,b)=>a.mins-b.mins);\n  if(!seg.length) return null;\n  let worst=\"good\",firstBad=null,firstCaution=null; const reasons=new Set();\n  let fMin=Infinity,fMax=-Infinity,probMax=0,gustMax=0,cSum=0,playN=0;\n  for(const s of seg){ const r=score(s);\n    if(rank(r.status)>rank(worst)) worst=r.status;\n    if(r.status===\"no\"&&!firstBad) firstBad=s;\n    if(r.status===\"caution\"&&!firstCaution) firstCaution=s;\n    r.reasons.forEach(x=>{ if(x!==\"Clear & comfortable\") reasons.add(x); });\n    fMin=Math.min(fMin,s.feels); fMax=Math.max(fMax,s.feels);\n    probMax=Math.max(probMax,s.prob); gustMax=Math.max(gustMax,s.gust);\n    cSum+=comfort(s); if(r.status!==\"no\") playN++; }\n  return { seg,worst,firstBad,firstCaution,reasons:[...reasons],\n    stats:{fMin,fMax,probMax,gustMax}, playable:playN/seg.length, avgComfort:cSum/seg.length,\n    coversFull: seg[seg.length-1].mins+ (seg[seg.length-1].gran||15) >= end };\n}\nfunction windowSummary(w){\n  if(w.worst===\"good\") return {cls:\"good\", label:\"Yes — clear the whole time\"};\n  if(w.worst===\"caution\") return {cls:\"caution\", label:\"Playable — but keep an eye out\"};\n  if(w.firstBad && w.seg[0].mins < w.firstBad.mins)\n    return {cls:\"caution\", label:`Good until ${fmtTime(w.firstBad.t)}, then not ideal`};\n  return {cls:\"no\", label:\"Not a good window\"};\n}\n\n/* ---------------- shared inputs ---------------- */\nfunction dateSelect(id,onchange){\n  const dates=[...new Set(DATA[0].slots.map(s=>s.date))];\n  return `<select id=\"${id}\" onchange=\"${onchange}\">`+dates.map(d=>\n    `<option value=\"${d}\" ${d===ui.date?\"selected\":\"\"}>${fmtDate(d)}${d===todayCentral()?\" (today)\":\"\"}<\u002Foption>`).join(\"\")+`<\u002Fselect>`;\n}\nfunction courtSelect(id,onchange,sel){\n  return `<select id=\"${id}\" onchange=\"${onchange}\">`+DATA.map((d,i)=>\n    `<option value=\"${i}\" ${i===sel?\"selected\":\"\"}>${d.court.name} · ${d.court.area.split(\" (\")[0]}<\u002Foption>`).join(\"\")+`<\u002Fselect>`;\n}\nfunction timeOptions(){ let o=\"\";\n  for(let h=CONFIG.hours.start;h<CONFIG.hours.end;h++) for(const m of [0,30]){\n    const ap=h<12?\"AM\":\"PM\";let hh=h%12;if(hh===0)hh=12;\n    o+=`<option value=\"${String(h).padStart(2,\"0\")}:${String(m).padStart(2,\"0\")}\">${hh}:${String(m).padStart(2,\"0\")} ${ap}<\u002Foption>`; }\n  return o;\n}\nfunction durationOptions(sel){ return DURATIONS.map(([v,l])=>`<option value=\"${v}\" ${v===sel?\"selected\":\"\"}>${l}<\u002Foption>`).join(\"\"); }\nfunction targetMins(date,time){ return toMinutes(`${date}T${time}`); }\nfunction defaultStart(date){\n  if(date!==todayCentral()) return \"09:00\";\n  const nm=nowMinsCentral();\n  for(let h=CONFIG.hours.start;h<CONFIG.hours.end;h++) for(const m of [0,30])\n    if(targetMins(date,`${String(h).padStart(2,\"0\")}:${String(m).padStart(2,\"0\")}`)>=nm)\n      return `${String(h).padStart(2,\"0\")}:${String(m).padStart(2,\"0\")}`;\n  return \"09:00\";\n}\n\n/* ---------------- render dispatch ---------------- */\nfunction render(){ if(!DATA) return; const app=document.getElementById(\"app\");\n  if(mode===\"now\") app.innerHTML=renderNow();\n  else if(mode===\"compare\") app.innerHTML=renderCompare();\n  else if(mode===\"plan\") app.innerHTML=renderPlan();\n  else app.innerHTML=renderDetail();\n}\n\n/* ---------------- MODE: NOW (hero verdict) ---------------- */\nlet nw={court:0,dur:90};\nfunction renderNow(){\n  let h=`<div class=\"card\">\n    <div class=\"row\"><label class=\"fld\"><span>Court<\u002Fspan>${courtSelect(\"nwCourt\",\"renderNowResult()\",nw.court)}<\u002Flabel>\n      <label class=\"fld\"><span>Match length<\u002Fspan><select id=\"nwDur\" onchange=\"renderNowResult()\">${durationOptions(nw.dur)}<\u002Fselect><\u002Flabel>\n    <\u002Fdiv><\u002Fdiv><div id=\"nwResult\"><\u002Fdiv>`;\n  setTimeout(renderNowResult,0); return h;\n}\nfunction renderNowResult(){\n  nw.court=+document.getElementById(\"nwCourt\").value;\n  nw.dur=+document.getElementById(\"nwDur\").value;\n  const d=DATA[nw.court]; const date=todayCentral(); const start=nowMinsCentral();\n  const w=evalWindow(d.slots.filter(s=>s.date===date),start,nw.dur);\n  const box=document.getElementById(\"nwResult\");\n  if(!w){ box.innerHTML='<div class=\"card err\">Courts are closed for the day — no forecast data left.<\u002Fdiv>'; return; }\n  const sum=windowSummary(w);\n  const day=d.slots.filter(s=>s.date===date).filter(inHours).sort((a,b)=>a.mins-b.mins);\n  const bar=day.map(s=>`<div class=\"seg ${score(s).status}\" title=\"${fmtTime(s.t)}\"><\u002Fdiv>`).join(\"\");\n  const rlist=w.reasons.length?w.reasons:[\"Clear & comfortable right now\"];\n  const ranked=DATA.map(dd=>{ const ww=evalWindow(dd.slots.filter(s=>s.date===date),start,nw.dur);\n    return ww?{court:dd.court,w:ww}:null; }).filter(Boolean)\n    .sort((a,b)=>rank(a.w.worst)-rank(b.w.worst)||b.w.playable-a.w.playable)\n    .filter(x=>x.court.name!==d.court.name).slice(0,4);\n  box.innerHTML=`<div class=\"card\">\n    <div class=\"cmeta\">${d.court.name} · ${d.court.area.split(\" (\")[0]} · right now<\u002Fdiv>\n    <div class=\"verdictWrap\"><div class=\"verdict ${sum.cls}\">${sum.label}<\u002Fdiv><\u002Fdiv>\n    <div class=\"asof\">as of ${fmtTime(date+\"T\"+String(new Date().toLocaleTimeString(\"en-US\",{timeZone:\"America/Chicago\",hour12:false,hour:\"2-digit\",minute:\"2-digit\"})))} CT · next ${nw.dur/60===1?\"1 hr\":nw.dur/60+\" hrs\"}<\u002Fdiv>\n    <div class=\"stats\">\n      <div class=\"stat\"><b>${Math.round(w.stats.fMin)}–${Math.round(w.stats.fMax)}°<\u002Fb><span>feels-like<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>${w.stats.probMax}%<\u002Fb><span>peak rain chance<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>${Math.round(w.stats.gustMax)} mph<\u002Fb><span>peak gusts<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>${w.playable>=1?\"Full\":Math.round(w.playable*100)+\"%\"}<\u002Fb><span>of window playable<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"reasons\">${rlist.map(x=>`<li>${x}<\u002Fli>`).join(\"\")}<\u002Ful>\n    <div class=\"miniHdr\">Today, ${hLabel(CONFIG.hours.start)}–${hLabel(CONFIG.hours.end)}<\u002Fdiv>\n    <div class=\"bar\">${bar}<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"hdr\">Other courts, right now<\u002Fdiv>\n    ${ranked.map(x=>{ const s2=windowSummary(x.w);\n      return `<div class=\"courtRow\" style=\"display:flex;justify-content:space-between;align-items:center\">\n        <div><div class=\"cname\">${x.court.name}<\u002Fdiv><div class=\"cmeta\">${x.court.area.split(\" (\")[0]}<\u002Fdiv><\u002Fdiv>\n        <span class=\"pill ${s2.cls}\">${s2.cls===\"good\"?\"good\":s2.cls===\"caution\"?\"caution\":\"no\"}<\u002Fspan><\u002Fdiv>`; }).join(\"\")}\n    <div class=\"subnote\">Full ranked list under the <b>Plan<\u002Fb> tab · every court's day under <b>Compare<\u002Fb>.<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n/* ---------------- MODE: COMPARE (all courts today) ---------------- */\nfunction renderCompare(){\n  let h=`<div class=\"card\"><div class=\"row\">\n     <label class=\"fld flex1\"><span>Day<\u002Fspan>${dateSelect(\"cmpDate\",\"ui.date=this.value;render()\")}<\u002Flabel>\n   <\u002Fdiv><div class=\"muted\" style=\"margin-top:8px\">Playable blocks, ${hLabel(CONFIG.hours.start)}–${hLabel(CONFIG.hours.end)}. Most clear time first.<\u002Fdiv><\u002Fdiv>`;\n  const rows=DATA.map(d=>{ const day=d.slots.filter(s=>s.date===ui.date);\n    const wins=windowsFor(day);\n    const inHrs=day.filter(inHours).sort((a,b)=>a.mins-b.mins);\n    const goodMin=inHrs.reduce((n,s)=>n+(score(s).status!==\"no\"?s.gran:0),0);\n    return {d,wins,inHrs,goodMin}; }).sort((a,b)=>b.goodMin-a.goodMin);\n  h+=`<div class=\"card\">`;\n  rows.forEach(r=>{\n    const bar=r.inHrs.map(s=>`<div class=\"seg ${score(s).status}\"><\u002Fdiv>`).join(\"\");\n    const winTxt=r.wins.length? r.wins.map(w=>\n      `<span class=\"dot\" style=\"background:var(--${w.status})\"><\u002Fspan>${labelFromMins(w.start)}–${labelFromMins(w.end+w.step)} <span class=\"pill ${w.status}\" style=\"padding:1px 7px\">${w.status===\"good\"?\"good\":\"ok\"}<\u002Fspan>`).join(\"<br>\")\n      : `<span style=\"color:var(--no)\">No playable window this day<\u002Fspan>`;\n    const hrs=r.goodMin/60;\n    h+=`<div class=\"courtRow\" style=\"flex-direction:column;align-items:stretch\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n          <div><div class=\"cname\">${r.d.court.name}<\u002Fdiv><div class=\"cmeta\">${r.d.court.area.split(\" (\")[0]}<\u002Fdiv><\u002Fdiv>\n          <span class=\"pill ${hrs>=2?\"good\":hrs>0?\"caution\":\"no\"}\">${hrs>0?hrs.toFixed(hrs<10?1:0)+\"h playable\":\"none\"}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"bar\">${bar}<\u002Fdiv><div class=\"win\">${winTxt}<\u002Fdiv><\u002Fdiv>`; });\n  h+=`<\u002Fdiv>`; return h;\n}\n\n/* ---------------- MODE: PLAN (rank courts for a window) ---------------- */\nlet pl={dur:60};\nfunction renderPlan(){\n  let h=`<div class=\"card\">\n    <div class=\"hdr\">Best courts for my match<\u002Fdiv>\n    <div class=\"row\">\n      <label class=\"fld\"><span>Day<\u002Fspan>${dateSelect(\"plDate\",\"renderPlanResult()\")}<\u002Flabel>\n      <label class=\"fld\"><span>Start<\u002Fspan><select id=\"plTime\" onchange=\"renderPlanResult()\">${timeOptions()}<\u002Fselect><\u002Flabel>\n      <label class=\"fld\"><span>Match length<\u002Fspan><select id=\"plDur\" onchange=\"renderPlanResult()\">${durationOptions(pl.dur)}<\u002Fselect><\u002Flabel>\n    <\u002Fdiv><\u002Fdiv><div id=\"plResult\"><\u002Fdiv>`;\n  setTimeout(()=>{ const t=document.getElementById(\"plTime\"); if(t) t.value=defaultStart(ui.date); renderPlanResult(); },0);\n  return h;\n}\nfunction renderPlanResult(){\n  pl.dur=+document.getElementById(\"plDur\").value;\n  const date=document.getElementById(\"plDate\").value, time=document.getElementById(\"plTime\").value;\n  ui.date=date; const start=targetMins(date,time);\n  const ranked=DATA.map(d=>{ const w=evalWindow(d.slots.filter(s=>s.date===date),start,pl.dur);\n    return w?{court:d.court,w,sum:windowSummary(w)}:null; }).filter(Boolean)\n    .sort((a,b)=> rank(a.w.worst)-rank(b.w.worst) || b.w.playable-a.w.playable || b.w.avgComfort-a.w.avgComfort);\n  const okN=ranked.filter(x=>x.w.worst!==\"no\").length;\n  let h=`<div class=\"card\"><div class=\"cmeta\" style=\"margin-bottom:2px\">${fmtDate(date)} · ${fmtTime(date+\"T\"+time)}–${labelFromMins(start+pl.dur)} · ${okN} of ${ranked.length} courts playable<\u002Fdiv>`;\n  ranked.forEach((x,i)=>{\n    const note = x.w.worst===\"good\" ? \"Clear the whole match\"\n      : (x.w.firstBad && x.w.seg[0].mins<x.w.firstBad.mins) ? `Good until ${fmtTime(x.w.firstBad.t)}`\n      : x.w.worst===\"caution\" ? (x.w.reasons[0]||\"Watch conditions\") : (x.w.reasons[0]||\"Not ideal\");\n    h+=`<div class=\"courtRow\"><div class=\"rank\">${i+1}<\u002Fdiv>\n        <div class=\"flex1\"><div class=\"cname\">${x.court.name}<\u002Fdiv>\n          <div class=\"cmeta\">${x.court.area.split(\" (\")[0]} · feels ${Math.round(x.w.stats.fMin)}–${Math.round(x.w.stats.fMax)}° · ${x.w.stats.probMax}% rain · ${note}<\u002Fdiv><\u002Fdiv>\n        <span class=\"pill ${x.sum.cls}\">${x.sum.cls===\"good\"?\"good\":x.sum.cls===\"caution\"?\"ok\":\"no\"}<\u002Fspan><\u002Fdiv>`; });\n  h+=`<\u002Fdiv>`; document.getElementById(\"plResult\").innerHTML=h;\n}\n\n/* ---------------- MODE: DETAIL (court check + temp chart + radar) ---------------- */\nlet dt={court:0,dur:60,overlay:\"radar\"};\nfunction renderDetail(){\n  let h=`<div class=\"card\">\n    <div class=\"hdr\">Court detail<\u002Fdiv>\n    <div class=\"row\"><label class=\"fld\"><span>Court<\u002Fspan>${courtSelect(\"dtCourt\",\"renderDetailResult()\",dt.court)}<\u002Flabel><\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:10px\">\n      <label class=\"fld\"><span>Day<\u002Fspan>${dateSelect(\"dtDate\",\"renderDetailResult()\")}<\u002Flabel>\n      <label class=\"fld\"><span>Start<\u002Fspan><select id=\"dtTime\" onchange=\"renderDetailResult()\">${timeOptions()}<\u002Fselect><\u002Flabel>\n      <label class=\"fld\"><span>Match length<\u002Fspan><select id=\"dtDur\" onchange=\"renderDetailResult()\">${durationOptions(dt.dur)}<\u002Fselect><\u002Flabel>\n    <\u002Fdiv><\u002Fdiv><div id=\"dtResult\"><\u002Fdiv>`;\n  setTimeout(()=>{ const t=document.getElementById(\"dtTime\"); if(t) t.value=defaultStart(ui.date); renderDetailResult(); },0);\n  return h;\n}\nfunction renderDetailResult(){\n  dt.court=+document.getElementById(\"dtCourt\").value;\n  dt.dur=+document.getElementById(\"dtDur\").value;\n  const date=document.getElementById(\"dtDate\").value, time=document.getElementById(\"dtTime\").value;\n  ui.date=date;\n  const d=DATA[dt.court], start=targetMins(date,time);\n  const w=evalWindow(d.slots.filter(s=>s.date===date),start,dt.dur);\n  const box=document.getElementById(\"dtResult\");\n  if(!w){ box.innerHTML='<div class=\"card err\">No forecast for that window.<\u002Fdiv>'; return; }\n  const sum=windowSummary(w);\n  const segbar=w.seg.map(s=>`<div class=\"seg ${score(s).status}\" title=\"${fmtTime(s.t)}\"><\u002Fdiv>`).join(\"\");\n  const rlist=w.reasons.length?w.reasons:[\"Clear & comfortable the whole time\"];\n  const day=d.slots.filter(s=>s.date===date).sort((a,b)=>a.mins-b.mins);\n  const chart=tempChart(day,date);\n  const c=d.court;\n  const overlays=[[\"radar\",\"Radar\"],[\"temp\",\"Temp\"],[\"wind\",\"Wind\"]];\n  const toggle=overlays.map(([v,l])=>`<button class=\"${v===dt.overlay?\"on\":\"\"}\" onclick=\"setOverlay('${v}')\">${l}<\u002Fbutton>`).join(\"\");\n  box.innerHTML=`<div class=\"card\">\n    <div class=\"cmeta\">${d.court.name} · ${fmtDate(date)} · ${fmtTime(date+\"T\"+time)}–${labelFromMins(start+dt.dur)}${w.coversFull?\"\":\" (forecast ends early)\"}<\u002Fdiv>\n    <div class=\"verdict ${sum.cls}\">${sum.label}<\u002Fdiv>\n    <div class=\"winbar\">${segbar}<\u002Fdiv>\n    <div class=\"stats\">\n      <div class=\"stat\"><b>${Math.round(w.stats.fMin)}–${Math.round(w.stats.fMax)}°<\u002Fb><span>feels-like range<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>${w.stats.probMax}%<\u002Fb><span>peak rain chance<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>${w.playable>=1?\"Full\":Math.round(w.playable*100)+\"%\"}<\u002Fb><span>of window playable<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>${Math.round(w.stats.gustMax)} mph<\u002Fb><span>peak gusts<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"reasons\">${rlist.map(x=>`<li>${x}<\u002Fli>`).join(\"\")}<\u002Ful>\n  <\u002Fdiv>\n  <div class=\"card\"><div class=\"hdr\">Temperature & rain — ${fmtDate(date)}<\u002Fdiv>\n    <div class=\"chartwrap\">${chart}<\u002Fdiv>\n    <div class=\"legend\"><span><span class=\"dot2\" style=\"background:var(--clay)\"><\u002Fspan>Feels-like<\u002Fspan>\n      <span><span class=\"dot2\" style=\"background:var(--ink)\"><\u002Fspan>Actual temp<\u002Fspan>\n      <span><span class=\"dot2\" style=\"background:var(--green)\"><\u002Fspan>Rain chance<\u002Fspan>\n      <span><span class=\"dot2\" style=\"background:rgba(74,107,65,.18)\"><\u002Fspan>Playable band<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><div class=\"hdr\">Live map<\u002Fdiv>\n    <div class=\"toggle\">${toggle}<\u002Fdiv>\n    <iframe class=\"radar\" id=\"windyFrame\" loading=\"lazy\" src=\"${windyURL(c.lat,c.lon,dt.overlay)}\" title=\"Radar map\"><\u002Fiframe>\n    <div class=\"subnote\">Interactive — drag to pan, scroll to zoom, press play at the bottom to watch rain move. Marker shows ${c.name}.<\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction setOverlay(o){ dt.overlay=o;\n  document.querySelectorAll(\".toggle button\").forEach(b=>b.classList.toggle(\"on\",b.textContent.toLowerCase()===o));\n  const f=document.getElementById(\"windyFrame\"); const c=DATA[dt.court].court;\n  if(f) f.src=windyURL(c.lat,c.lon,o);\n}\nfunction windyURL(lat,lon,overlay){\n  return `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}`\n    +`&zoom=9&level=surface&overlay=${overlay}&menu=&message=&marker=true&calendar=now&pressure=`\n    +`&type=map&location=coordinates&metricWind=mph&metricTemp=%C2%B0F&radarRange=-1`;\n}\n\n/* ---------------- temperature chart (inline SVG, clay/bluegrass palette) ---------------- */\nfunction tempChart(day,date){\n  const W=720,H=270,padL=40,padR=14,padT=16,padB=42;\n  const h0=CONFIG.hours.start*60, h1=CONFIG.hours.end*60;\n  const dayStart=toMinutes(date+\"T00:00\");\n  const pts=day.map(s=>({mod:s.mins-dayStart, feels:s.feels, temp:s.temp, prob:s.prob}))\n               .filter(p=>p.mod>=h0-30 && p.mod<=h1+30);\n  if(pts.length<2) return `<div class=\"muted\" style=\"padding:20px\">No detailed data for this day.<\u002Fdiv>`;\n  const temps=pts.flatMap(p=>[p.feels,p.temp]);\n  let tMin=Math.min(...temps), tMax=Math.max(...temps);\n  tMin=Math.floor((tMin-3)/5)*5; tMax=Math.ceil((tMax+3)/5)*5;\n  if(tMax-tMin<15) tMax=tMin+15;\n  const x=mod=>padL+((mod-h0)/(h1-h0))*(W-padL-padR);\n  const y=t=>padT+(1-(t-tMin)/(tMax-tMin))*(H-padT-padB);\n  const yR=p=>H-padB-(p/100)*(H-padT-padB)*0.42;\n  const line=(key)=>pts.map((p,i)=>`${i?\"L\":\"M\"}${x(p.mod).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(\" \");\n  const rainArea=`M${x(pts[0].mod).toFixed(1)} ${(H-padB).toFixed(1)} `\n    +pts.map(p=>`L${x(p.mod).toFixed(1)} ${yR(p.prob).toFixed(1)}`).join(\" \")\n    +` L${x(pts[pts.length-1].mod).toFixed(1)} ${(H-padB).toFixed(1)} Z`;\n  let grid=\"\",ticks=\"\";\n  for(let t=tMin;t<=tMax;t+=5){ const yy=y(t).toFixed(1);\n    grid+=`<line x1=\"${padL}\" y1=\"${yy}\" x2=\"${W-padR}\" y2=\"${yy}\" stroke=\"#ece0c6\"/>`;\n    if((t-tMin)%10===0) ticks+=`<text x=\"${padL-6}\" y=\"${(+yy+3).toFixed(1)}\" text-anchor=\"end\" font-size=\"10\" fill=\"#8a7a5c\">${t}°<\u002Ftext>`; }\n  let band=\"\";\n  const bTop=Math.min(CONFIG.temp.maxNo,tMax), bBot=Math.max(CONFIG.temp.minNo,tMin);\n  if(bTop>bBot) band=`<rect x=\"${padL}\" y=\"${y(bTop).toFixed(1)}\" width=\"${W-padL-padR}\" height=\"${(y(bBot)-y(bTop)).toFixed(1)}\" fill=\"rgba(74,107,65,.10)\"/>`;\n  let thr=\"\";\n  [CONFIG.temp.minNo,CONFIG.temp.maxNo].forEach(t=>{ if(t>tMin&&t<tMax)\n    thr+=`<line x1=\"${padL}\" y1=\"${y(t).toFixed(1)}\" x2=\"${W-padR}\" y2=\"${y(t).toFixed(1)}\" stroke=\"#c98d6f\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/>`\n       +`<text x=\"${W-padR}\" y=\"${(y(t)-3).toFixed(1)}\" text-anchor=\"end\" font-size=\"9\" fill=\"#a13a29\">${t}°<\u002Ftext>`; });\n  let xt=\"\";\n  for(let hh=CONFIG.hours.start;hh<=CONFIG.hours.end;hh+=3){ const xx=x(hh*60).toFixed(1);\n    xt+=`<line x1=\"${xx}\" y1=\"${padT}\" x2=\"${xx}\" y2=\"${H-padB}\" stroke=\"#f1e9d5\"/>`\n      +`<text x=\"${xx}\" y=\"${H-padB+16}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5c\">${hLabel(hh)}<\u002Ftext>`; }\n  let nowline=\"\";\n  if(date===todayCentral()){ const nm=nowMinsCentral()-dayStart;\n    if(nm>=h0&&nm<=h1){ const nx=x(nm).toFixed(1);\n      nowline=`<line x1=\"${nx}\" y1=\"${padT}\" x2=\"${nx}\" y2=\"${H-padB}\" stroke=\"#4a6b41\" stroke-width=\"1.2\" stroke-dasharray=\"2 3\"/>`\n        +`<text x=\"${nx}\" y=\"${padT-3}\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a6b41\">now<\u002Ftext>`; } }\n  return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" preserveAspectRatio=\"xMidYMid meet\" font-family=\"inherit\">\n    ${grid}${band}${xt}${thr}\n    <path d=\"${rainArea}\" fill=\"rgba(74,107,65,.28)\" stroke=\"none\"/>\n    <text x=\"${padL+2}\" y=\"${H-padB-4}\" font-size=\"9\" fill=\"#4a6b41\">rain %<\u002Ftext>\n    <path d=\"${line('temp')}\" fill=\"none\" stroke=\"#2c2015\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" opacity=\".8\"/>\n    <path d=\"${line('feels')}\" fill=\"none\" stroke=\"#b3552a\" stroke-width=\"2.6\"/>\n    ${ticks}${nowline}\n  <\u002Fsvg>`;\n}\n\n/* ---------------- tabs ---------------- */\nfunction setMode(m){ mode=m;\n  document.querySelectorAll(\".tab\").forEach(t=>t.classList.toggle(\"active\",t.dataset.mode===m));\n  render();\n}\ndocument.getElementById(\"rulesText\").innerHTML=\n  `Rain is the hard stop: any measurable precip or ≥${CONFIG.rain.probNo}% chance = <b>No<\u002Fb>; ${CONFIG.rain.probCaution}–${CONFIG.rain.probNo}% = caution. `\n +`Feels-like below ${CONFIG.temp.minNo}° or above ${CONFIG.temp.maxNo}° = No; ${CONFIG.temp.minNo}–${CONFIG.temp.minCaution}° or ${CONFIG.temp.maxCaution}–${CONFIG.temp.maxNo}° = caution. `\n +`Wind is minor: gusts ≥${CONFIG.wind.gustCaution} mph = caution. For a match window, the verdict uses the worst moment across your start time + length. Edit thresholds in the CONFIG block near the top of the file.`;\n\nloadWeather();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
